[project]
name = "tenko-plugin-bf6"
version = "0.1.0"
description = "Tenko 战地六查询：经 bf-manager 查询玩家生涯战绩、武器、载具和对局估算"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11,<3.14"
keywords = ["tenko", "tenko-plugin", "qq", "battlefield", "bf6"]
classifiers = [
    "Framework :: AsyncIO",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "tenko-api>=0.4,<0.5",
    "httpx>=0.27",
    "jinja2>=3",
    "sqlalchemy>=2.0",
]

[project.urls]
Homepage = "https://github.com/g1331/tenko-plugins/tree/main/plugins/bf6"
Repository = "https://github.com/g1331/tenko-plugins"

[project.entry-points."tenko.plugins"]
bf6 = "tenko_plugin_bf6"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenko_plugin_bf6"]
