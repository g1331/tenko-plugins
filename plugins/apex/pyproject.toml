[project]
name = "tenko-plugin-apex"
version = "0.1.0"
description = "Tenko Apex 英雄查询：玩家战绩、地图轮换、猎杀线、服务器状态和官方资讯"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11,<3.14"
keywords = ["tenko", "tenko-plugin", "qq", "apex", "apex-legends"]
classifiers = [
    "Framework :: AsyncIO",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "tenko-api>=0.4,<0.5",
    "httpx>=0.27",
    "jinja2>=3",
    "zhconv>=1.4",
]

[project.urls]
Homepage = "https://github.com/g1331/tenko-plugins/tree/main/plugins/apex"
Repository = "https://github.com/g1331/tenko-plugins"

[project.entry-points."tenko.plugins"]
apex = "tenko_plugin_apex"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenko_plugin_apex"]
