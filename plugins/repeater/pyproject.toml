[project]
name = "tenko-plugin-repeater"
version = "0.1.0"
description = "Tenko 复读机：群友复读时偶尔跟一句，偶尔打断一下"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11,<3.14"
dependencies = [
    "tenko-api>=0.2,<0.3",
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/g1331/tenko-plugins/tree/main/plugins/repeater"
Repository = "https://github.com/g1331/tenko-plugins"

[project.entry-points."tenko.plugins"]
repeater = "tenko_plugin_repeater"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenko_plugin_repeater"]
