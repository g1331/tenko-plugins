[project]
name = "tenko-plugin-tarot"
version = "0.1.0"
description = "Tenko 塔罗牌：今日塔罗、三张牌阵和凯尔特十字占卜，牌面是 B 站幻星集"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11,<3.14"
keywords = ["tenko", "tenko-plugin", "qq", "tarot"]
classifiers = [
    "Framework :: AsyncIO",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "tenko-api>=0.4.3,<0.5",
    "jinja2>=3",
    "pillow>=10",
    "sqlalchemy>=2.0",
]

[project.urls]
Homepage = "https://github.com/g1331/tenko-plugins/tree/main/plugins/tarot"
Repository = "https://github.com/g1331/tenko-plugins"

[project.entry-points."tenko.plugins"]
tarot = "tenko_plugin_tarot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenko_plugin_tarot"]
