[project]
name = "tenko-plugin-persona-chat"
version = "0.1.35"
description = "Tenko AI 群友：接入 DeepSeek，用人设口吻陪群友聊天，内置“大肥鱼”"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11,<3.14"
keywords = ["tenko", "tenko-plugin", "qq", "deepseek", "llm", "chatbot"]
classifiers = [
    "Framework :: AsyncIO",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "tenko-api>=0.4.1,<0.5",
    "httpx>=0.27",
    "pillow>=10",
    "pypinyin>=0.51",
    "zhconv>=1.4",
]

[project.urls]
Homepage = "https://github.com/g1331/tenko-plugins/tree/main/plugins/persona_chat"
Repository = "https://github.com/g1331/tenko-plugins"

[project.entry-points."tenko.plugins"]
persona_chat = "tenko_plugin_persona_chat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenko_plugin_persona_chat"]
