<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
{#- 视觉沿用 bf-manager 网页：切角面板、Oswald 数字、琥珀色强调、稀有度配色。
    图要在手机上看：最小字号 17px，底板接近不透明，字不和背景混在一起。 -#}
<style>
  @font-face { font-family: "Oswald"; src: url({{ asset("Oswald.ttf") }}) format("truetype"); font-weight: 200 700; }
  {% if sc_font %}@font-face { font-family: "SC"; src: url({{ sc_font }}) format("woff2"); font-weight: 100 900; }{% endif %}
  :root {
    --amber: #fbbf24; --amber-deep: #f59e0b; --amber-soft: #fcd34d;
    --text: #fff; --soft: rgba(255,255,255,.88); --muted: rgba(255,255,255,.7); --line: rgba(255,255,255,.14);
    --panel: #141418;
    --green: #10b981; --red: #ef4444;
    --gold: #ca843a; --blue: #1e90ff; --skin-gold: #ecd996; --skin-blue: #bfcfde;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; }
  body { width: {{ width|default(1000) }}px; color: var(--text); font-family: "SC", "WenQuanYi Zen Hei", sans-serif; font-size: 20px;
    -webkit-font-smoothing: antialiased; }
  .d { font-family: "Oswald", "SC", "WenQuanYi Zen Hei", sans-serif; font-variant-numeric: tabular-nums; }
  .page { position: relative; padding: 24px 24px 18px; overflow: hidden; }
  .bg { position: absolute; inset: 0; z-index: 0; }
  .bg i { position: absolute; inset: -12px; background-size: cover; background-position: center top; filter: blur(10px); }
  .bg::before { content: ""; position: absolute; inset: 0; z-index: 1; background: rgba(0,0,0,.6); }
  .page > *:not(.bg) { position: relative; z-index: 2; }
  .panel { background: var(--panel); padding: 24px 26px;
    clip-path: polygon(0 18px, 18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%); }
  .sh { display: flex; align-items: center; gap: 12px; margin: 0 0 20px; font-size: 26px; font-weight: 700; }
  .sh::before { content: ""; width: 5px; height: 24px; background: var(--amber); flex: none; }
  .sh .aside { margin-left: auto; font-size: 17px; font-weight: 400; color: var(--muted); }
  .label { font-size: 17px; color: var(--muted); }
  .eyebrow { font-family: "Oswald", "SC", sans-serif; font-size: 18px; letter-spacing: .15em; color: var(--amber); }
  .avatar { border-radius: 50%; object-fit: cover; background: rgba(255,255,255,.12); flex: none; border: 5px solid #6b6b72; }
  .avatar.online { border-color: #3aca6b; }
  .icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bar { height: 8px; background: rgba(255,255,255,.12); }
  .bar i { display: block; height: 100%; background: var(--amber); }
  .rarity-gold { color: var(--skin-gold); } .rarity-blue { color: var(--skin-blue); } .rarity-white { color: var(--soft); }
  .star { width: 20px; height: 20px; flex: none; }
  footer { margin-top: 16px; text-align: center; font-size: 16px; color: var(--muted); letter-spacing: .05em; }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<div class="page">
  <div class="bg"><i style="background-image: url({{ background }})"></i></div>
  {% block body %}{% endblock %}
  {% block footer %}<footer><span class="d">BF-MANAGER</span> · {{ source }} · <span class="d">{{ now }}</span></footer>{% endblock %}
</div>
</body>
</html>
