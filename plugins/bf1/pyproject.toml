[project]
name = "tenko-plugin-bf1"
version = "0.1.16"
description = "Tenko 战地一查询：经 bf-manager 查询玩家战绩、武器、载具、最近对局和服务器，带百科、小贴士和入群审核"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11,<3.14"
keywords = ["tenko", "tenko-plugin", "qq", "battlefield", "bf1"]
classifiers = [
    "Framework :: AsyncIO",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "tenko-api>=0.4,<0.5",
    "httpx>=0.27",
    "jinja2>=3",
    "sqlalchemy>=2.0",
    "zhconv>=1.4",
]

[project.urls]
Homepage = "https://github.com/g1331/tenko-plugins/tree/main/plugins/bf1"
Repository = "https://github.com/g1331/tenko-plugins"

[project.entry-points."tenko.plugins"]
bf1 = "tenko_plugin_bf1"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenko_plugin_bf1"]
